name: CI

# Lint and build every push / pull request to main so broken code is caught
# before it is pulled onto the VPS. The build needs no database or API keys:
# pages that read MySQL fall back to bundled data when it is unreachable.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
